<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public shares</title>
  <meta name="description" content="Public pages for sharing. GeoPlantation plan proposal and later notes live here.">
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e2dbd0;
      --paper: #fffcf7;
      --green: #1d6b45;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    .wrap {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    p.brand {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--green);
    }

    h1 {
      margin: 12px 0 10px;
      font-size: clamp(36px, 6vw, 52px);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    .lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.5;
    }

    a.card {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      color: inherit;
      text-decoration: none;
    }

    a.card:hover { border-color: var(--green); }

    a.card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1.25rem;
    }

    a.card span {
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="brand">Public</p>
    <h1>Shared pages</h1>
    <p class="lede">Pages meant to be opened by anyone. New notes go in their own folder, next to the ones already here.</p>
    <a class="card" href="geoplantation/plan/index.html">
      <strong>GeoPlantation / Plan</strong>
      <span>Lite, Premium, and Enterprise. One GeoPDF for six months, then the paid plan.</span>
    </a>
  </main>
</body>
</html>
