<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public shares</title>
  <meta name="description" content="Public pages for sharing. GeoPlantation plan proposal and later notes live here.">
  <style>
    :root {
      --bg: #f5f7f6;
      --ink: #1a2420;
      --muted: #5c6b64;
      --line: #e3eae6;
      --paper: #ffffff;
      --green: #1f5c45;
      --green-dark: #1a4d3a;
      --green-soft: #eef4f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 5vw, 40px);
      font-weight: 720;
      letter-spacing: -0.035em;
    }
    .lede { margin: 0 0 28px; color: var(--muted); }
    a.card {
      display: grid;
      gap: 6px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      color: inherit;
      text-decoration: none;
    }
    a.card:hover { border-color: #b7e4cd; }
    a.card strong { font-size: 1.25rem; letter-spacing: -0.02em; }
    a.card span { color: var(--muted); }
    .tag {
      justify-self: start;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Public</p>
    <h1>Shared pages</h1>
    <p class="lede">Notes meant to be opened by anyone. Each topic gets its own folder.</p>
    <a class="card" href="geoplantation/plan/index.html">
      <span class="tag">GeoPlantation</span>
      <strong>Plan</strong>
      <span>Lite, Premium, and Enterprise. One GeoPDF for six months, then the paid plan.</span>
    </a>
  </div>
</body>
</html>
