<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public shares</title>
  <meta name="description" content="Public pages for sharing. GeoPlantation plan proposal and later notes live here.">
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1915;
      --muted: #5e574e;
      --line: #e3d9cc;
      --paper: #fffdf8;
      --navy: #172033;
      --brass: #9a7433;
      --brass-bright: #e4c78a;
      --brass-soft: #f6edd9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(800px 360px at 100% -10%, rgba(228, 199, 138, 0.2), transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }
    .top {
      background:
        linear-gradient(160deg, rgba(228, 199, 138, 0.16), transparent 42%),
        var(--navy);
      color: #f7f1e6;
      padding: 36px 0 42px;
    }
    .wrap { width: min(880px, calc(100% - 40px)); margin: 0 auto; }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brass-bright);
    }
    h1 {
      margin: 0 0 10px;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
      font-size: clamp(36px, 5vw, 52px);
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .lede { margin: 0; max-width: 36rem; color: #ddd4c6; line-height: 1.5; }
    main { padding: 28px 0 72px; }
    a.card {
      display: grid;
      gap: 8px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.05);
    }
    a.card:hover { border-color: var(--brass); }
    a.card strong {
      font-family: Palatino, "Palatino Linotype", Georgia, serif;
      font-size: 1.6rem;
      font-weight: 600;
    }
    a.card span { color: var(--muted); line-height: 1.45; }
    .tag {
      justify-self: start;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--brass-soft);
      color: var(--brass);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <p class="eyebrow">Public</p>
      <h1>Shared pages</h1>
      <p class="lede">Notes meant to be opened by anyone. Each topic gets its own folder.</p>
    </div>
  </header>
  <main>
    <div class="wrap">
      <a class="card" href="geoplantation/plan/index.html">
        <span class="tag">GeoPlantation</span>
        <strong>Plan</strong>
        <span>Lite, Premium, and Enterprise. One GeoPDF for six months, then the paid plan.</span>
      </a>
    </div>
  </main>
</body>
</html>
