<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-label="Path clearance calculation cases">
  <rect width="1040" height="460" rx="16" fill="#f4f7f4"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#152019">Path clearance · calculation</text>
  <text x="32" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Sample DEM along A→B · find peak ground · raise by clearance C · fit parabola arc</text>

  <!-- terrain profile -->
  <path d="M60 320 C 160 310, 240 250, 340 200 C 420 165, 500 230, 600 245 C 720 265, 820 280, 980 290" fill="none" stroke="#8a6a12" stroke-width="3.5"/>
  <path d="M60 320 C 160 310, 240 250, 340 200 C 420 165, 500 230, 600 245 C 720 265, 820 280, 980 290 L980 380 L60 380 Z" fill="#e8efe4" opacity="0.75"/>
  <line x1="340" y1="200" x2="340" y2="140" stroke="#1b6b3c" stroke-width="2.5"/>
  <text x="350" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#1b6b3c">C</text>
  <circle cx="340" cy="200" r="6" fill="#8a6a12"/>
  <text x="300" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">g_peak</text>
  <path d="M80 300 Q 340 120 960 275" fill="none" stroke="#1b6b3c" stroke-width="3.5" stroke-dasharray="9 6"/>
  <text x="430" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b6b3c">clearance arc (z)</text>
  <circle cx="90" cy="305" r="8" fill="#1b6b3c"/>
  <circle cx="950" cy="280" r="8" fill="#7a6420"/>
  <text x="70" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b6b3c">A</text>
  <text x="930" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#7a6420">B</text>

  <rect x="40" y="40" width="0" height="0"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="40" y="70" width="320" height="100" rx="12" fill="#fff" stroke="#d7e0d9"/>
    <text x="56" y="98" font-weight="700" fill="#152019">Step 1 · Sample</text>
    <text x="56" y="122" fill="#3d4f44">Along geodesic A→B sample DEM</text>
    <text x="56" y="144" fill="#3d4f44">elevations → ground profile g(s)</text>

    <rect x="380" y="70" width="300" height="100" rx="12" fill="#fff" stroke="#d7e0d9"/>
    <text x="396" y="98" font-weight="700" fill="#152019">Step 2 · Peak + C</text>
    <text x="396" y="122" fill="#3d4f44">g_peak = max(g(s))</text>
    <text x="396" y="144" fill="#145530">z_peak = g_peak + C</text>

    <rect x="700" y="70" width="300" height="100" rx="12" fill="#fff8e8" stroke="#d6c48a"/>
    <text x="716" y="98" font-weight="700" fill="#4a3d18">Step 3 · Arc</text>
    <text x="716" y="122" fill="#5a4a18">Fit parabola through A, z_peak, B</text>
    <text x="716" y="144" fill="#5a4a18">Animate projectile along arc</text>
  </g>
</svg>
