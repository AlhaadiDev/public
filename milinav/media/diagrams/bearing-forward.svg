<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="Forward bearing calculation from A to B">
  <rect width="1040" height="420" rx="16" fill="#f4f7f4"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#152019">Forward bearing θ (A → B)</text>
  <text x="32" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Clockwise from North · great-circle · same code path as FastLock needle</text>

  <circle cx="300" cy="250" r="130" fill="#fff" stroke="#1b6b3c" stroke-width="2.5"/>
  <line x1="300" y1="250" x2="300" y2="120" stroke="#bcc9bf" stroke-width="2"/>
  <line x1="300" y1="250" x2="430" y2="250" stroke="#bcc9bf" stroke-width="2"/>
  <text x="288" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5a6b60">N 0°</text>
  <text x="438" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5a6b60">E 90°</text>
  <path d="M300 140 A110 110 0 0 1 392 178" fill="none" stroke="#7a6420" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="360" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#7a6420">θ</text>
  <line x1="300" y1="250" x2="400" y2="150" stroke="#1b6b3c" stroke-width="5" stroke-linecap="round"/>
  <polygon points="400,150 380,156 390,170" fill="#1b6b3c"/>
  <circle cx="300" cy="250" r="10" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="3"/>
  <circle cx="400" cy="150" r="10" fill="#7a6420"/>
  <text x="210" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b6b3c">A · you / start</text>
  <text x="414" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#7a6420">B · landmark / dest</text>

  <rect x="560" y="100" width="440" height="270" rx="14" fill="#fff" stroke="#d7e0d9"/>
  <text x="584" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#152019">Logic</text>
  <text x="584" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">1. Convert A,B lat/lon to radians (φ, λ)</text>
  <text x="584" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">2. Δλ = λ_B − λ_A</text>
  <text x="584" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">3. Build local east/north components:</text>
  <text x="584" y="248" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#145530">y = sin(Δλ)·cos(φ_B)</text>
  <text x="584" y="272" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#145530">x = cos(φ_A)·sin(φ_B) − sin(φ_A)·cos(φ_B)·cos(Δλ)</text>
  <text x="584" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">4. θ = atan2(y, x) → normalize 0–360°</text>
  <text x="584" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Code: CompassBearingHelper.calculateBearing()</text>
</svg>
