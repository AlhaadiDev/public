<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Destination from bearing and distance">
  <rect width="960" height="300" rx="12" fill="#f7faf7"/>
  <text x="28" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">Destination from bearing + distance</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Given start, θ, and distance d → compute destination on the sphere</text>
  <circle cx="160" cy="180" r="12" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
  <text x="120" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b6b3c">Start (φ₁, λ₁)</text>
  <line x1="172" y1="172" x2="520" y2="120" stroke="#1b6b3c" stroke-width="3"/>
  <polygon points="520,120 504,124 510,136" fill="#1b6b3c"/>
  <text x="300" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#7a6420">θ · d</text>
  <circle cx="540" cy="115" r="12" fill="#7a6420"/>
  <text x="560" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#7a6420">Dest (φ₂, λ₂)</text>
  <rect x="40" y="230" width="880" height="50" rx="10" fill="#fff" stroke="#d7e0d9"/>
  <text x="55" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">φ₂ = arcsin(sin φ₁ · cos d + cos φ₁ · sin d · cos θ)   ·   λ₂ from atan2 of spherical terms</text>
</svg>
