<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Gyro pitch and roll sign check">
  <rect width="960" height="300" rx="12" fill="#f7faf7"/>
  <text x="28" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">Gyro sign check — pitch vs roll</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Uphill should move pitch (not roll). Left turn should roll left.</text>
  <rect x="40" y="90" width="280" height="160" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
  <text x="60" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b6b3c">Uphill</text>
  <path d="M70 200 L200 140 L280 140" fill="none" stroke="#8a6a12" stroke-width="4"/>
  <polygon points="180,150 200,140 185,160" fill="#1b6b3c"/>
  <text x="60" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#3d4f44">Pitch = climb · Roll ≈ 0</text>
  <rect x="340" y="90" width="280" height="160" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
  <text x="360" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b6b3c">Downhill</text>
  <path d="M370 140 L500 200 L600 200" fill="none" stroke="#8a6a12" stroke-width="4"/>
  <text x="360" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#3d4f44">Pitch opposite · Roll ≈ 0</text>
  <rect x="640" y="90" width="280" height="160" rx="12" fill="#fff" stroke="#7a6420" stroke-width="2"/>
  <text x="660" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#7a6420">Turn left (flat)</text>
  <ellipse cx="780" cy="180" rx="70" ry="28" fill="none" stroke="#bcc9bf" stroke-width="2"/>
  <path d="M740 170 Q780 150 820 170" fill="none" stroke="#7a6420" stroke-width="3"/>
  <text x="660" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#3d4f44">Roll gauge leans left</text>
</svg>
