<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-label="How a message hops between mesh nodes">
  <rect width="1040" height="520" rx="16" fill="#f4f7f4"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#152019">Node travel · hop / bounce limit</text>
  <text x="32" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Each rebroadcast uses 1 hop. When remaining hops reach 0, nodes stop repeating the packet.</text>

  <!-- chain -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="90" cy="180" r="34" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="3"/>
    <text x="78" y="176" font-size="13" font-weight="800" fill="#145530">You</text>
    <text x="68" y="194" font-size="11" fill="#5a6b60">send</text>

    <path d="M130 180 H190" stroke="#1b6b3c" stroke-width="3"/>
    <polygon points="190,180 176,172 176,188" fill="#1b6b3c"/>
    <text x="140" y="166" font-size="11" font-weight="700" fill="#7a6420">hop 1</text>

    <circle cx="240" cy="180" r="30" fill="#fff" stroke="#7a6420" stroke-width="2.5"/>
    <text x="222" y="185" font-size="13" font-weight="700" fill="#7a6420">Node A</text>

    <path d="M276 180 H336" stroke="#1b6b3c" stroke-width="3"/>
    <polygon points="336,180 322,172 322,188" fill="#1b6b3c"/>
    <text x="286" y="166" font-size="11" font-weight="700" fill="#7a6420">hop 2</text>

    <circle cx="384" cy="180" r="30" fill="#fff" stroke="#7a6420" stroke-width="2.5"/>
    <text x="366" y="185" font-size="13" font-weight="700" fill="#7a6420">Node B</text>

    <path d="M420 180 H480" stroke="#1b6b3c" stroke-width="3"/>
    <polygon points="480,180 466,172 466,188" fill="#1b6b3c"/>
    <text x="430" y="166" font-size="11" font-weight="700" fill="#7a6420">hop 3</text>

    <circle cx="530" cy="180" r="34" fill="#fff8e8" stroke="#7a6420" stroke-width="3"/>
    <text x="504" y="176" font-size="13" font-weight="800" fill="#7a6420">Target</text>
    <text x="508" y="194" font-size="11" fill="#5a6b60">receives</text>

    <!-- out of range -->
    <path d="M574 180 H650" stroke="#bcc9bf" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="700" cy="180" r="28" fill="#f3f5f2" stroke="#bcc9bf" stroke-width="2"/>
    <text x="670" y="176" font-size="12" font-weight="700" fill="#5a6b60">Far node</text>
    <text x="668" y="194" font-size="11" fill="#8a6a12">no more hops</text>
    <text x="620" y="150" font-size="11" font-weight="700" fill="#8a6a12">stopped</text>
  </g>

  <!-- counter panel -->
  <rect x="40" y="250" width="460" height="230" rx="14" fill="#fff" stroke="#d7e0d9"/>
  <text x="60" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#152019">Hop limit (bounces)</text>
  <text x="60" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">Set in Setup → Range and speed</text>
  <text x="60" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#145530">Typical default: 3</text>
  <text x="60" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#145530">Allowed range in TacNav: 1 – 7</text>
  <text x="60" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">With hop limit = 3, the packet can be</text>
  <text x="60" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">repeated by up to 3 other radios.</text>
  <text x="60" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">More hops = farther mesh reach, more airtime.</text>

  <rect x="520" y="250" width="480" height="230" rx="14" fill="#fff8e8" stroke="#d6c48a"/>
  <text x="540" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a3d18">What hop is NOT</text>
  <text x="540" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a4a18">• Not the RF metres of one radio</text>
  <text x="540" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a4a18">• Not “max friends in the channel”</text>
  <text x="540" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a4a18">• Modem preset controls radio range</text>
  <text x="540" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a4a18">• Hop limit controls how many times</text>
  <text x="540" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a4a18">  the packet may bounce node → node</text>
  <text x="540" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a3d18">Think: “how many relays until stop”</text>
</svg>
