<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-label="Live GPS versus fixed course modes">
  <rect width="1040" height="380" rx="16" fill="#f4f7f4"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#152019">Course modes</text>
  <text x="32" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Same destination pin · different start behaviour</text>

  <rect x="40" y="100" width="460" height="240" rx="14" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
  <text x="60" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#145530">A · Live GPS → fixed destination</text>
  <circle cx="120" cy="220" r="10" fill="#1b6b3c"/>
  <circle cx="400" cy="180" r="12" fill="#7a6420"/>
  <line x1="120" y1="220" x2="400" y2="180" stroke="#1b6b3c" stroke-width="3"/>
  <circle cx="200" cy="250" r="8" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
  <line x1="200" y1="250" x2="400" y2="180" stroke="#7a6420" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">You move → θ_live recomputed to same pin</text>
  <text x="60" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Default FastLock / floating compass</text>

  <rect x="540" y="100" width="460" height="240" rx="14" fill="#fff" stroke="#7a6420" stroke-width="2"/>
  <text x="560" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7a6420">B · Fixed A → B start</text>
  <circle cx="620" cy="220" r="10" fill="#7a6420"/>
  <circle cx="900" cy="180" r="12" fill="#7a6420"/>
  <line x1="620" y1="220" x2="900" y2="180" stroke="#7a6420" stroke-width="3"/>
  <circle cx="700" cy="260" r="8" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
  <text x="560" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">Course line stays on dropped start</text>
  <text x="560" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Offline / planned-leg demos</text>
</svg>
