<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="Public channel flood versus private direct relay">
  <rect width="1040" height="560" rx="16" fill="#f4f7f4"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#152019">Public channel vs private message · how nodes pass it</text>
  <text x="32" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Same LoRa channel slot. Difference is toId: empty = everyone; node id = one peer.</text>

  <!-- PUBLIC -->
  <rect x="28" y="90" width="484" height="430" rx="14" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
  <rect x="28" y="90" width="484" height="44" rx="14" fill="#1b6b3c"/>
  <rect x="28" y="118" width="484" height="16" fill="#1b6b3c"/>
  <text x="48" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Public / channel (“Everyone”)</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="120" cy="220" r="26" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2.5"/>
    <text x="108" y="225" font-size="12" font-weight="800" fill="#145530">You</text>

    <circle cx="250" cy="190" r="20" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="238" y="195" font-size="11" font-weight="700" fill="#7a6420">A</text>
    <circle cx="250" cy="250" r="20" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="238" y="255" font-size="11" font-weight="700" fill="#7a6420">B</text>
    <circle cx="380" cy="190" r="20" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="368" y="195" font-size="11" font-weight="700" fill="#7a6420">C</text>
    <circle cx="380" cy="250" r="20" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="368" y="255" font-size="11" font-weight="700" fill="#7a6420">D</text>

    <line x1="146" y1="214" x2="230" y2="195" stroke="#1b6b3c" stroke-width="2"/>
    <line x1="146" y1="226" x2="230" y2="245" stroke="#1b6b3c" stroke-width="2"/>
    <line x1="270" y1="190" x2="360" y2="190" stroke="#1b6b3c" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="270" y1="250" x2="360" y2="250" stroke="#1b6b3c" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="250" y1="210" x2="250" y2="230" stroke="#bcc9bf" stroke-width="1.5"/>

    <text x="48" y="310" font-size="13" font-weight="700" fill="#145530">What happens</text>
    <text x="48" y="338" font-size="13" fill="#3d4f44">1. You send with toId empty</text>
    <text x="48" y="362" font-size="13" fill="#3d4f44">2. Nearby nodes on that channel decrypt</text>
    <text x="48" y="386" font-size="13" fill="#3d4f44">3. They show the chat AND may rebroadcast</text>
    <text x="48" y="410" font-size="13" fill="#3d4f44">4. Flood continues until hop limit ends</text>
    <text x="48" y="442" font-size="13" fill="#5a6b60">Anyone with the channel PSK can read it</text>
    <text x="48" y="466" font-size="13" fill="#5a6b60">Status usually stays Sent (no delivery ACK)</text>
    <text x="48" y="494" font-size="12" fill="#8a6a12">UI: Everyone on this channel</text>
  </g>

  <!-- PRIVATE -->
  <rect x="528" y="90" width="484" height="430" rx="14" fill="#fff" stroke="#7a6420" stroke-width="2"/>
  <rect x="528" y="90" width="484" height="44" rx="14" fill="#7a6420"/>
  <rect x="528" y="118" width="484" height="16" fill="#7a6420"/>
  <text x="548" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Private / direct (one peer)</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="620" cy="220" r="26" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2.5"/>
    <text x="608" y="225" font-size="12" font-weight="800" fill="#145530">You</text>

    <circle cx="740" cy="170" r="18" fill="#f3f5f2" stroke="#bcc9bf" stroke-width="2"/>
    <text x="728" y="175" font-size="11" fill="#5a6b60">A</text>
    <text x="700" y="150" font-size="10" fill="#5a6b60">relay only</text>

    <circle cx="860" cy="220" r="26" fill="#fff8e8" stroke="#7a6420" stroke-width="2.5"/>
    <text x="838" y="225" font-size="12" font-weight="800" fill="#7a6420">Peer</text>

    <circle cx="740" cy="280" r="18" fill="#f3f5f2" stroke="#bcc9bf" stroke-width="2"/>
    <text x="728" y="285" font-size="11" fill="#5a6b60">B</text>
    <text x="692" y="310" font-size="10" fill="#5a6b60">hears RF, ignores UI</text>

    <line x1="646" y1="210" x2="722" y2="178" stroke="#7a6420" stroke-width="2.5"/>
    <line x1="758" y1="178" x2="834" y2="210" stroke="#7a6420" stroke-width="2.5"/>
    <line x1="646" y1="230" x2="722" y2="272" stroke="#bcc9bf" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="548" y="350" font-size="13" font-weight="700" fill="#7a6420">What happens</text>
    <text x="548" y="378" font-size="13" fill="#3d4f44">1. You send with toId = peer node id</text>
    <text x="548" y="402" font-size="13" fill="#3d4f44">2. Relays may bounce it (same hop limit)</text>
    <text x="548" y="426" font-size="13" fill="#3d4f44">3. Only the addressed peer opens it as DM</text>
    <text x="548" y="450" font-size="13" fill="#3d4f44">4. Others can still hear RF airtime</text>
    <text x="548" y="482" font-size="13" fill="#5a6b60">Status: Queued → Delivered / Retrying</text>
    <text x="548" y="506" font-size="12" fill="#8a6a12">UI: Send message to that node</text>
  </g>
</svg>
