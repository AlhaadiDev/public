<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="USB port modes">
  <rect width="960" height="260" rx="12" fill="#f7faf7"/>
  <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">USB port modes</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Choose the mode that matches field security vs. maintenance needs</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="28" y="88" width="280" height="140" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="48" y="122" font-weight="700" fill="#152019">Charging only</text>
    <text x="48" y="146" fill="#3d4f44">Power in — no data</text>
    <text x="48" y="168" fill="#3d4f44">Best for kiosk fleet</text>
    <text x="48" y="190" fill="#145530">Lower exposure risk</text>

    <rect x="340" y="88" width="280" height="140" rx="12" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="360" y="122" font-weight="700" fill="#152019">MTP / file transfer</text>
    <text x="360" y="146" fill="#3d4f44">Full data access</text>
    <text x="360" y="168" fill="#3d4f44">User-selectable</text>
    <text x="360" y="190" fill="#7a6420">Avoid on secured units</text>

    <rect x="652" y="88" width="280" height="140" rx="12" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
    <text x="672" y="122" font-weight="700" fill="#145530">ADB (debug)</text>
    <text x="672" y="146" fill="#3d4f44">Developer cable use</text>
    <text x="672" y="168" fill="#3d4f44">Policy / install / logs</text>
    <text x="672" y="190" fill="#145530">Disable after setup</text>
  </g>
</svg>