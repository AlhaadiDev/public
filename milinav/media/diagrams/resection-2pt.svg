<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Two-point resection">
  <rect width="960" height="340" rx="12" fill="#f7faf7"/>
  <text x="28" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">Two-point resection</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Intersect two back-bearing lines from known landmarks → estimated position</text>
  <!-- landmarks -->
  <circle cx="180" cy="120" r="12" fill="#7a6420"/>
  <text x="160" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#7a6420">L1</text>
  <circle cx="720" cy="130" r="12" fill="#7a6420"/>
  <text x="700" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#7a6420">L2</text>
  <!-- back bearing rays -->
  <line x1="180" y1="120" x2="480" y2="260" stroke="#1b6b3c" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="720" y1="130" x2="480" y2="260" stroke="#1b6b3c" stroke-width="2.5" stroke-dasharray="8 5"/>
  <circle cx="480" cy="260" r="14" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="3"/>
  <text x="430" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b6b3c">You (intersection)</text>
  <rect x="40" y="70" width="280" height="70" rx="10" fill="#fff" stroke="#d7e0d9"/>
  <text x="55" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#3d4f44">1. Measure bearing to L1 &amp; L2</text>
  <text x="55" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#3d4f44">2. Draw θ_back rays from each</text>
  <rect x="640" y="220" width="280" height="70" rx="10" fill="#fff8e8" stroke="#d6c48a"/>
  <text x="655" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a4a18">Caution: nearly parallel rays →</text>
  <text x="655" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a4a18">weak fix (prefer 3 landmarks)</text>
</svg>
