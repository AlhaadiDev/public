<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-label="Two-point resection logic">
  <rect width="1040" height="400" rx="16" fill="#f4f7f4"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#152019">Two-point resection</text>
  <text x="32" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Forward bearings → back bearings (+180°) → intersect rays from landmarks</text>

  <circle cx="200" cy="140" r="14" fill="#7a6420"/>
  <text x="170" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7a6420">L1</text>
  <circle cx="780" cy="150" r="14" fill="#7a6420"/>
  <text x="750" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7a6420">L2</text>
  <line x1="200" y1="140" x2="500" y2="300" stroke="#1b6b3c" stroke-width="3" stroke-dasharray="10 6"/>
  <line x1="780" y1="150" x2="500" y2="300" stroke="#1b6b3c" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="500" cy="300" r="16" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="3"/>
  <text x="430" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1b6b3c">You · intersection</text>

  <rect x="40" y="90" width="300" height="120" rx="12" fill="#fff" stroke="#d7e0d9"/>
  <text x="56" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#152019">Logic</text>
  <text x="56" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">1. Measure θ to L1 and L2</text>
  <text x="56" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">2. θ_back = (θ + 180°) mod 360</text>
  <text x="56" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">3. Intersect both back rays</text>

  <rect x="680" y="250" width="320" height="100" rx="12" fill="#fff8e8" stroke="#d6c48a"/>
  <text x="696" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a3d18">Weak when rays are nearly parallel</text>
  <text x="696" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a4a18">Prefer three landmarks for a robust fix</text>
</svg>
