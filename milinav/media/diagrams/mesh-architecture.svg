<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Spatial Mesh architecture">
  <rect width="960" height="300" rx="12" fill="#f7faf7"/>
  <text x="28" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">How Spatial Mesh fits MiliNav</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">One Bluetooth link to the radio — plugin owns BT; TacNav is the soldier UI</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="40" y="90" width="180" height="120" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="60" y="128" font-weight="700" fill="#1b6b3c">MiliNav TacNav</text>
    <text x="60" y="152" fill="#3d4f44">Chat · Nodes · Map</text>
    <text x="60" y="174" fill="#3d4f44">Setup · Share</text>
    <text x="60" y="196" fill="#5a6b60">mesh-api (AIDL)</text>
    <path d="M230 150 H270" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="275" y="90" width="200" height="120" rx="12" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
    <text x="295" y="128" font-weight="700" fill="#1b6b3c">Spatial Mesh plugin</text>
    <text x="295" y="152" fill="#3d4f44">com.myspatial.meshtastic</text>
    <text x="295" y="174" fill="#3d4f44">Bluetooth owner</text>
    <text x="295" y="196" fill="#5a6b60">Meshtastic protocol</text>
    <path d="M485 150 H525" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="530" y="90" width="180" height="120" rx="12" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="550" y="128" font-weight="700" fill="#7a6420">LoRa radio</text>
    <text x="550" y="152" fill="#3d4f44">e.g. T-Beam</text>
    <text x="550" y="174" fill="#3d4f44">Channels · hops</text>
    <text x="550" y="196" fill="#5a6b60">One BT link only</text>
    <path d="M720 150 H760" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="765" y="90" width="155" height="120" rx="12" fill="#fff8e8" stroke="#d6c48a"/>
    <text x="780" y="128" font-weight="700" fill="#5a4a18">Other radios</text>
    <text x="780" y="152" fill="#5a4a18">Mesh peers</text>
    <text x="780" y="174" fill="#5a4a18">LoRa RF</text>
    <text x="780" y="196" fill="#5a4a18">hop 1–7</text>
  </g>
  <text x="40" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Close the stock Meshtastic app before linking — the radio allows only one Bluetooth connection.</text>
</svg>
