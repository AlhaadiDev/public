<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Compass bearing navigation">
  <rect width="960" height="320" rx="12" fill="#f7faf7"/>
  <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">Compass bearing navigation</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Bearing is from live GPS toward a fixed destination — destination does not move with drift</text>
  <circle cx="230" cy="185" r="95" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
  <circle cx="230" cy="185" r="4" fill="#152019"/>
  <line x1="230" y1="185" x2="230" y2="100" stroke="#bcc9bf" stroke-width="1"/>
  <line x1="230" y1="185" x2="230" y2="270" stroke="#bcc9bf" stroke-width="1"/>
  <line x1="230" y1="185" x2="145" y2="185" stroke="#bcc9bf" stroke-width="1"/>
  <line x1="230" y1="185" x2="315" y2="185" stroke="#bcc9bf" stroke-width="1"/>
  <text x="222" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">N</text>
  <!-- needle toward NE destination -->
  <line x1="230" y1="185" x2="300" y2="120" stroke="#1b6b3c" stroke-width="4" stroke-linecap="round"/>
  <polygon points="300,120 286,128 294,136" fill="#1b6b3c"/>
  <circle cx="230" cy="185" r="10" fill="#e8f4ec" stroke="#1b6b3c"/>
  <text x="248" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#145530">You (GPS)</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#152019">
    <rect x="420" y="100" width="500" height="170" rx="12" fill="#fff" stroke="#d7e0d9"/>
    <text x="440" y="132" font-weight="700">How it updates</text>
    <text x="440" y="160" fill="#3d4f44">1. Destination is fixed on the map</text>
    <text x="440" y="186" fill="#3d4f44">2. Live GPS position refreshes continuously</text>
    <text x="440" y="212" fill="#3d4f44">3. Needle = bearing from current GPS → dest</text>
    <text x="440" y="238" fill="#145530">Drift moves you — not the destination pin</text>
  </g>
</svg>