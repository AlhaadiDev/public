<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="ADB setup flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7faf7"/><stop offset="100%" stop-color="#eef4ef"/>
    </linearGradient>
  </defs>
  <rect width="960" height="240" rx="12" fill="url(#bg)"/>
  <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">ADB setup flow</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Install platform tools → enable developer options → authorize device → verify</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#152019">
    <rect x="28" y="88" width="170" height="88" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="48" y="122" font-weight="700">1. Install ADB</text>
    <text x="48" y="144" fill="#3d4f44">SDK Platform-Tools</text>
    <text x="48" y="162" fill="#3d4f44">Windows / macOS</text>

    <path d="M210 132 H248" stroke="#1b6b3c" stroke-width="2" marker-end="url(#a)"/>
    <rect x="250" y="88" width="170" height="88" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="270" y="122" font-weight="700">2. Device prep</text>
    <text x="270" y="144" fill="#3d4f44">Developer options</text>
    <text x="270" y="162" fill="#3d4f44">USB debugging ON</text>

    <path d="M432 132 H470" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="472" y="88" width="170" height="88" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="492" y="122" font-weight="700">3. Authorize</text>
    <text x="492" y="144" fill="#3d4f44">USB cable</text>
    <text x="492" y="162" fill="#3d4f44">RSA prompt → Allow</text>

    <path d="M654 132 H692" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="694" y="88" width="236" height="88" rx="12" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
    <text x="714" y="122" font-weight="700">4. Verify</text>
    <text x="714" y="144" fill="#145530">adb devices</text>
    <text x="714" y="162" fill="#145530">device status = device</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1b6b3c"/></marker></defs>
</svg>