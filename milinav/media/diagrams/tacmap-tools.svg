<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="TacMap feature map">
  <rect width="960" height="280" rx="12" fill="#f7faf7"/>
  <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">TacMap feature map</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Orient Tools, Navigation, graphics, and sensors before reading the full listing</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="28" y="88" width="210" height="150" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="48" y="122" font-weight="700" fill="#152019">Tools</text>
    <text x="48" y="148" fill="#3d4f44">Measure · Buffer</text>
    <text x="48" y="170" fill="#3d4f44">Path clearance</text>
    <text x="48" y="192" fill="#3d4f44">Coordinates</text>
    <text x="48" y="214" fill="#3d4f44">Layer / basemap</text>

    <rect x="260" y="88" width="210" height="150" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="280" y="122" font-weight="700" fill="#152019">Navigation</text>
    <text x="280" y="148" fill="#3d4f44">Compass bearing</text>
    <text x="280" y="170" fill="#3d4f44">Goto / route</text>
    <text x="280" y="192" fill="#3d4f44">Own position</text>
    <text x="280" y="214" fill="#3d4f44">Offline maps</text>

    <rect x="492" y="88" width="210" height="150" rx="12" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="512" y="122" font-weight="700" fill="#152019">Graphics</text>
    <text x="512" y="148" fill="#3d4f44">Battle graphics</text>
    <text x="512" y="170" fill="#3d4f44">Control measures</text>
    <text x="512" y="192" fill="#3d4f44">Share / export</text>
    <text x="512" y="214" fill="#3d4f44">Annotations</text>

    <rect x="724" y="88" width="208" height="150" rx="12" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
    <text x="744" y="122" font-weight="700" fill="#145530">Sensors</text>
    <text x="744" y="148" fill="#3d4f44">GPS / GNSS</text>
    <text x="744" y="170" fill="#3d4f44">Compass / gyro</text>
    <text x="744" y="192" fill="#3d4f44">Device health</text>
    <text x="744" y="214" fill="#3d4f44">Billing / ArcGIS</text>
