<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="TacMap Tools map for field use">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7faf7"/>
      <stop offset="100%" stop-color="#eef3ee"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="420" rx="16" fill="url(#bg)"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#152019">TacMap · Field Tools map</text>
  <text x="32" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Open Tools on the map. Search by name. Submenus open with Back.</text>

  <!-- row 1 -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="32" y="92" width="230" height="140" rx="14" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="32" y="92" width="230" height="36" rx="14" fill="#1b6b3c"/>
    <rect x="32" y="110" width="230" height="18" fill="#1b6b3c"/>
    <text x="48" y="116" font-size="14" font-weight="700" fill="#fff">Tracks</text>
    <text x="48" y="150" fill="#3d4f44">Create Track (GPS / draw)</text>
    <text x="48" y="172" fill="#3d4f44">Breadcrumbs ON/OFF</text>
    <text x="48" y="194" fill="#5a6b60">Map Library for saved paths</text>

    <rect x="280" y="92" width="230" height="140" rx="14" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="280" y="92" width="230" height="36" rx="14" fill="#1b6b3c"/>
    <rect x="280" y="110" width="230" height="18" fill="#1b6b3c"/>
    <text x="296" y="116" font-size="14" font-weight="700" fill="#fff">Plots &amp; Reports</text>
    <text x="296" y="150" fill="#3d4f44">Draw Graphics</text>
    <text x="296" y="172" fill="#3d4f44">Control Measures</text>
    <text x="296" y="194" fill="#3d4f44">SPOTREP · Photo Mode</text>
    <text x="296" y="216" fill="#5a6b60">Troop Tracking · soon</text>

    <rect x="528" y="92" width="230" height="140" rx="14" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <rect x="528" y="92" width="230" height="36" rx="14" fill="#7a6420"/>
    <rect x="528" y="110" width="230" height="18" fill="#7a6420"/>
    <text x="544" y="116" font-size="14" font-weight="700" fill="#fff">Navigate</text>
    <text x="544" y="150" fill="#3d4f44">Compass Mode / FastLock</text>
    <text x="544" y="172" fill="#3d4f44">Compass Bearing (resect)</text>
    <text x="544" y="194" fill="#3d4f44">Get Directions · Go To Grid</text>
    <text x="544" y="216" fill="#5a6b60">Live GPS → fixed destination</text>

    <rect x="776" y="92" width="232" height="140" rx="14" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="776" y="92" width="232" height="36" rx="14" fill="#145530"/>
    <rect x="776" y="110" width="232" height="18" fill="#145530"/>
    <text x="792" y="116" font-size="14" font-weight="700" fill="#fff">Measure &amp; Terrain</text>
    <text x="792" y="150" fill="#3d4f44">Distance &amp; Direction</text>
    <text x="792" y="172" fill="#3d4f44">Can I see it? (LOS)</text>
    <text x="792" y="194" fill="#3d4f44">Path clearance</text>
    <text x="792" y="216" fill="#5a6b60">Offline DEM preferred</text>
  </g>

  <!-- row 2 -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="32" y="254" width="310" height="136" rx="14" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="48" y="286" font-size="14" font-weight="700" fill="#152019">Map look</text>
    <text x="48" y="312" fill="#3d4f44">Basemap Style · Overlays</text>
    <text x="48" y="334" fill="#3d4f44">Grid · Library · Import packages</text>
    <text x="48" y="356" fill="#5a6b60">Your layers — not JUPEM packages</text>

    <rect x="360" y="254" width="310" height="136" rx="14" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="376" y="286" font-size="14" font-weight="700" fill="#152019">JUPEM files</text>
    <text x="376" y="312" fill="#3d4f44">Download / Decrypt ZIP</text>
    <text x="376" y="334" fill="#3d4f44">Activate TOPO / OSM MMPK</text>
    <text x="376" y="356" fill="#5a6b60">Official basemap — separate menu</text>

    <rect x="688" y="254" width="320" height="136" rx="14" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
    <text x="704" y="286" font-size="14" font-weight="700" fill="#145530">Share · HUD · Device</text>
    <text x="704" y="312" fill="#3d4f44">Battle graphics .shua · Screenshot</text>
    <text x="704" y="334" fill="#3d4f44">Coordinate format · Map HUD</text>
    <text x="704" y="356" fill="#3d4f44">Tracking · Kiosk · Save · More</text>
  </g>
</svg>
