<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="Three-point resection logic">
  <rect width="1040" height="420" rx="16" fill="#f4f7f4"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#152019">Three-point resection</text>
  <text x="32" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b60">Three back-bearing intersections · final fix = average of the three points</text>

  <circle cx="180" cy="130" r="12" fill="#7a6420"/>
  <text x="160" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#7a6420">L1</text>
  <circle cx="820" cy="140" r="12" fill="#7a6420"/>
  <text x="800" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#7a6420">L2</text>
  <circle cx="500" cy="90" r="12" fill="#7a6420"/>
  <text x="480" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#7a6420">L3</text>

  <line x1="180" y1="130" x2="460" y2="300" stroke="#1b6b3c" stroke-width="2.5" stroke-dasharray="8 5" opacity="0.85"/>
  <line x1="820" y1="140" x2="540" y2="300" stroke="#1b6b3c" stroke-width="2.5" stroke-dasharray="8 5" opacity="0.85"/>
  <line x1="500" y1="90" x2="500" y2="310" stroke="#7a6420" stroke-width="2.5" stroke-dasharray="8 5" opacity="0.85"/>

  <circle cx="470" cy="295" r="7" fill="#bcc9bf"/>
  <circle cx="530" cy="295" r="7" fill="#bcc9bf"/>
  <circle cx="500" cy="275" r="7" fill="#bcc9bf"/>
  <circle cx="500" cy="290" r="16" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="3"/>
  <text x="430" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b6b3c">Average = estimated you</text>

  <rect x="40" y="180" width="280" height="130" rx="12" fill="#fff" stroke="#d7e0d9"/>
  <text x="56" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#152019">Logic</text>
  <text x="56" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">Pairs: L1–L2, L2–L3, L1–L3</text>
  <text x="56" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3d4f44">Solve each intersection locally</text>
  <text x="56" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#145530">fix = mean(lat, lon)</text>
</svg>
