<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Offline map packaging flow">
  <rect width="960" height="240" rx="12" fill="#f7faf7"/>
  <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#152019">Offline map packaging</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b60">Raster → MMPK / encrypted ZIP → SD card → device decrypt / load</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#152019">
    <rect x="28" y="90" width="155" height="90" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="48" y="128" font-weight="700">TIFF / BGSP</text>
    <text x="48" y="150" fill="#3d4f44">WGS84 raster</text>

    <path d="M195 135 H225" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="228" y="90" width="155" height="90" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="248" y="128" font-weight="700">ArcGIS Pro</text>
    <text x="248" y="150" fill="#3d4f44">Mosaic · MMPK</text>

    <path d="M395 135 H425" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="428" y="90" width="155" height="90" rx="12" fill="#fff" stroke="#7a6420" stroke-width="2"/>
    <text x="448" y="128" font-weight="700">7-Zip / encrypt</text>
    <text x="448" y="150" fill="#3d4f44">Package for SD</text>

    <path d="M595 135 H625" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="628" y="90" width="140" height="90" rx="12" fill="#fff" stroke="#1b6b3c" stroke-width="2"/>
    <text x="648" y="128" font-weight="700">SD card</text>
    <text x="648" y="150" fill="#3d4f44">Field copy</text>

    <path d="M780 135 H810" stroke="#1b6b3c" stroke-width="2"/>
    <rect x="812" y="90" width="120" height="90" rx="12" fill="#e8f4ec" stroke="#1b6b3c" stroke-width="2"/>
    <text x="832" y="128" font-weight="700">MiliNav</text>
    <text x="832" y="150" fill="#145530">Decrypt</text>
  </g>
</svg>